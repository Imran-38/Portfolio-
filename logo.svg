<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002752;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon Circle Badge -->
  <circle cx="30" cy="30" r="25" fill="url(#bgGrad)" />
  <circle cx="30" cy="30" r="23" fill="none" stroke="#ffc107" stroke-width="2" />
  
  <!-- Monogram IH Inside Circle -->
  <text x="30" y="37" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="bold" fill="#ffc107" text-anchor="middle">IH</text>

  <!-- Sales Growth Graphic Line -->
  <path d="M 18 38 L 25 32 L 30 35 L 42 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <polygon points="42,20 38,24 43,25" fill="#ffffff" />

  <!-- Brand Name Text -->
  <text x="68" y="32" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="700" fill="#ffffff">ইমরান <tspan fill="#ffc107">হোসেন</tspan></text>
  
  <!-- Subtitle Tagline -->
  <text x="68" y="47" font-family="'Hind Siliguri', sans-serif" font-size="10" font-weight="600" stroke="none" fill="#e0e0e0" letter-spacing="0.5">RFL SALES PROFESSIONAL</text>
</svg>
